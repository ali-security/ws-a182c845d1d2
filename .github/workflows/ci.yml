name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha test file(s) to run instead of the full suite'
        required: false
        default: ''

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        arch:
          - x64
          - x86
        node:
          - 10
          - 12
          - 14
          - 16
          - 18
          - 19
        os:
          - macOS-latest
          - ubuntu-latest
          - windows-latest
        exclude:
          - arch: x86
            os: macOS-latest
          - arch: x86
            os: ubuntu-latest
          - arch: x86
            node: 18
            os: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.arch }}
      - run: npm install
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx mocha --throw-deprecation ${{ inputs.test-filter }}
          else
            npm test
          fi
        shell: bash
      - run: |
          mkdir -p dist
          npm pack --pack-destination dist
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        shell: bash
      - uses: actions/upload-artifact@v4
        if:
          matrix.os == 'ubuntu-latest' && matrix.node == 18 && matrix.arch ==
          'x64'
        with:
          name: ws-tarball
          path: dist/*.tgz
          if-no-files-found: error
